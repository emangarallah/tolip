    <script>
      // Apply the saved theme before styles load to avoid a flash of the wrong color scheme.
      let initialTheme = 'light';
      try {
        initialTheme = localStorage.getItem('tulip_theme') === 'dark' ? 'dark' : 'light';
      } catch (_) {}
      document.documentElement.classList.toggle('dark', initialTheme === 'dark');
      document.documentElement.style.colorScheme = initialTheme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute(
        'content',
        initialTheme === 'dark' ? '#121513' : '#FFF7F5'
      );
    </script>
    <title>توليب – Tolipe Natural Care | متجر العناية الطبيعية</title>
